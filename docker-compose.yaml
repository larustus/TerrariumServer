version: '3.8'

services:
  backend:
    build: ./backendTerrarium
    container_name: backend-terrarium
    restart: unless-stopped
    depends_on:
      - mysql-dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-dev:3306/terraSystem
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=devpass

        
  user-shop-service:
    build: ./user-shop-service
    container_name: user-shop-service
    ports:
      - "8083:8080"
    restart: unless-stopped
    depends_on:
      - mysql-dev
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-dev:3306/terraSystem
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=devpass
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate



  websocket:
    build: ./websocket
    container_name: websocket-server
    ports:
      - "8082:8082"
    command: node server.mjs
    restart: unless-stopped

  mysql-dev:
    image: mysql:8
    container_name: terra-db-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: devpass
      MYSQL_DATABASE: terraSystem
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql

volumes:
  mysql_dev_data:
